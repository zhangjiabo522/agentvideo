server {
    listen 80;
    server_name llmvideo.jx.fyi;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/yingxu-preview/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://llmvideo.jx.fyi$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name llmvideo.jx.fyi;

    ssl_certificate /etc/letsencrypt/live/llmvideo.jx.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llmvideo.jx.fyi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YingxuPreviewTLS:10m;
    ssl_session_timeout 1d;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 404;
    }

    client_max_body_size 1m;
    access_log /opt/yingxu-preview/access.log;
    error_log /opt/yingxu-preview/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/yingxu-preview/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /mcp {
        return 404;
    }

    location ^~ /uploads/ {
        return 404;
    }

    location ^~ /data/ {
        return 404;
    }

    location = /render.html {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
